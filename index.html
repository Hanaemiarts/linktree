<!doctype html>
<html lang="en" data-theme="saturated">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linktree | Hanaemi arts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img-resources/ha-cat.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <img class="background-art" src="img-resources/hisu.png" alt="" aria-hidden="true">
    <main id="main" class="linktree-container">
      <h1 class="brand-title">Hanaemi arts</h1>
      <p class="intro">DnD character and content artist</p>
      <p class="availability">Commissions: Open ✨</p>

      <nav aria-label="Social and project links">
        <div class="button-row button-row-primary">
          <a class="button button-primary" href="https://www.instagram.com/hanaemiarts/">
            <span class="button-icon button-icon-mask icon-instagram" aria-hidden="true"></span>
            <span>Instagram</span>
          </a>
          <a class="button button-primary" href="https://www.twitch.tv/hanaemi">
            <span class="button-icon button-icon-mask icon-twitch" aria-hidden="true"></span>
            <span>Twitch</span>
          </a>
          <a class="button button-primary" href="https://ko-fi.com/hanaemi/shop">
            <img class="button-icon button-icon-image" src="icons/kofi.svg" alt="" aria-hidden="true">
            <span>Web shop</span>
          </a>
        </div>
        <div class="button-row button-row-secondary">
          <a class="button button-secondary" href="terms/">
            <span class="button-icon button-icon-mask icon-heart" aria-hidden="true"></span>
            <span>Terms of service</span>
          </a>
        </div>
      </nav>
    </main>
  </body>
</html>
